<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DoorApp Log Summary</title>

    <style>
      :root {
        --bg: #f5f7fa;
        --card: #ffffff;
        --text: #222;
        --text-light: #666;
        --accent: #2c3e50;
        --success: #27ae60;
        --error: #e74c3c;
      }

      body.dark {
        --bg: #1c1c1e;
        --card: #2a2a2d;
        --text: #f1f1f1;
        --text-light: #bdbdbd;
        --accent: #4a90e2;
      }

      body {
        font-family: Arial, sans-serif;
        background: var(--bg);
        margin: 0;
        padding: 15px;
        transition: background 0.3s, color 0.3s;
        color: var(--text);
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .toggle-btn {
        background: var(--accent);
        color: #fff;
        padding: 8px 15px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
      }

      .card {
        background: var(--card);
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 20px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      }

      .refresh-btn {
        float: right;
        background: var(--accent);
        padding: 7px 15px;
        border-radius: 6px;
        border: none;
        color: white;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
        gap: 12px;
      }

      .stat-box {
        background: var(--card);
        border-radius: 10px;
        padding: 12px;
        text-align: center;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
      }

      .stat-label {
        font-size: 12px;
        color: var(--text-light);
      }

      .collapsible-header {
        padding: 12px;
        background: var(--accent);
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        margin-top: 10px;
      }

      .collapsible-content {
        overflow: hidden;
        max-height: 0;
        transition: max-height 0.35s ease;
        margin-top: 5px;
      }

      .table-wrapper {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--card);
        border-radius: 10px;
        overflow: hidden;
        min-width: 600px;
      }

      th,
      td {
        padding: 10px 12px;
        white-space: nowrap;
      }

      th {
        background: var(--accent);
        color: white;
        font-size: 14px;
      }

      tr:nth-child(even) {
        background: rgba(0, 0, 0, 0.05);
      }
      body.dark tr:nth-child(even) {
        background: rgba(255, 255, 255, 0.07);
      }

      .status-success {
        color: var(--success);
      }
      .status-error {
        color: var(--error);
      }

      .last-updated {
        text-align: center;
        font-size: 13px;
        color: var(--text-light);
      }
    </style>
  </head>

  <body>
    <div class="top-row">
      <h1>DoorApp Dashboard</h1>
      <button class="toggle-btn" onclick="toggleDarkMode()">🌙</button>
    </div>

    <div class="card">
      <button class="refresh-btn" onclick="loadLogData()">🔄 Refresh</button>
      <h2>Summary Overview</h2>

      <div id="loading">Loading...</div>
      <div id="error" style="display: none; color: var(--error)"></div>

      <div id="summary" style="display: none">
        <div class="stat-grid">
          <div class="stat-box">
            <div class="stat-label">Total Req</div>
            <div id="stat-total-requests">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">DXF</div>
            <div id="stat-dxf-files">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">PDF</div>
            <div id="stat-pdf-files">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Bulk</div>
            <div id="stat-bulk-executions">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Restarts</div>
            <div id="stat-server-restarts">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Errors</div>
            <div id="stat-errors">0</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Collapsible: File Generation -->
    <div class="collapsible-header" onclick="expandSection('file-gen')">
      📂 File Generation Details
    </div>
    <div class="collapsible-content" id="file-gen">
      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Run</th>
                <th>User</th>
                <th>Time</th>
                <th>Type</th>
                <th>Name</th>
                <th>Status</th>
                <th>Sec</th>
              </tr>
            </thead>
            <tbody id="file-generation-table"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="last-updated" id="last-updated"></div>

    <script>
      /* ---------------- DARK MODE ---------------- */
      function toggleDarkMode() {
        document.body.classList.toggle("dark");
      }

      /* ---------------- COLLAPSIBLE ---------------- */
      function expandSection(id) {
        const el = document.getElementById(id);
        el.style.maxHeight = el.style.maxHeight ? null : el.scrollHeight + "px";
      }

      /* ---------------- DATA LOAD ---------------- */
      async function loadLogData() {
        const loading = document.getElementById("loading");
        const error = document.getElementById("error");
        const summary = document.getElementById("summary");

        loading.style.display = "block";
        error.style.display = "none";

        try {
          const res = await fetch("/api/logs/summary");
          const data = await res.json();

          loading.style.display = "none";
          summary.style.display = "block";

          document.getElementById("stat-total-requests").textContent =
            data.summary.total_requests;
          document.getElementById("stat-dxf-files").textContent =
            data.summary.dxf_files;
          document.getElementById("stat-pdf-files").textContent =
            data.summary.pdf_files;
          document.getElementById("stat-bulk-executions").textContent =
            data.summary.bulk_executions;
          document.getElementById("stat-server-restarts").textContent =
            data.summary.server_restarts;
          document.getElementById("stat-errors").textContent =
            data.summary.errors;

          /* Tables */
          const fileTable = document.getElementById("file-generation-table");
          fileTable.innerHTML = "";
          data.single_dxf_executions.forEach((i, idx) => {
            // Check if PDF was actually generated (not "❌ Not requested")
            const hasPdf = i.pdf_file && !i.pdf_file.includes("❌");

            const displayName = i.is_bulk
              ? `${i.file_count || 0} files`
              : (hasPdf ? i.pdf_file : i.dxf_file) || "N/A";

            let fileType = "";
            if (i.is_bulk) {
              fileType = "Bulk";
            } else if (hasPdf) {
              fileType = "PDF";
            } else if (i.dxf_file) {
              fileType = "DXF";
            }

            fileTable.innerHTML += `
        <tr>
          <td>Run ${idx + 1}</td>
          <td>${i.user || "anonymous"}</td>
          <td>${i.time}</td>
          <td>${fileType}</td>
          <td>${displayName}</td>
          <td class="${
            i.status === "Success" ? "status-success" : "status-error"
          }">${i.status}</td>
          <td>${i.execution_time}</td>
        </tr>`;
          });

          document.getElementById("last-updated").textContent =
            "Last updated: " + new Date().toLocaleString();
        } catch (e) {
          loading.style.display = "none";
          error.style.display = "block";
          error.textContent = "Error: " + e.message;
        }
      }

      loadLogData();
      setInterval(loadLogData, 30000);
    </script>
  </body>
</html>
